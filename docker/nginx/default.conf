# =============================================================================
# Configuração Nginx para Laravel
# =============================================================================
# O Nginx atua como "porteiro" da aplicação:
#   1. Recebe a requisição HTTP do navegador
#   2. Se for arquivo estático (CSS, JS, imagens) → serve diretamente
#   3. Se for PHP → encaminha para o PHP-FPM (container "app")
# =============================================================================

server {
    # Porta que o Nginx escuta dentro do container
    listen 80;

    # Nome do servidor (aceita qualquer)
    server_name localhost;

    # Diretório raiz do Laravel (pasta "public")
    root /var/www/html/public;

    # Arquivos index padrão
    index index.php index.html;

    # Charset UTF-8
    charset utf-8;

    # -----------------------------------------------------------
    # Headers de Segurança
    # -----------------------------------------------------------
    # Impede que a aplicação seja embutida em iframe (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Impede que o navegador "adivinhe" o tipo do conteúdo (MIME sniffing)
    add_header X-Content-Type-Options "nosniff" always;
    # Proteção contra XSS refletido
    add_header X-XSS-Protection "1; mode=block" always;
    # Controla quais informações de referência são enviadas
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Oculta a versão do Nginx nos headers (dificulta busca de CVEs)
    server_tokens off;

    # Limite de upload (previne DoS via upload gigante)
    client_max_body_size 10m;

    # -----------------------------------------------------------
    # Roteamento principal
    # -----------------------------------------------------------
    # Tenta servir o arquivo diretamente. Se não existir,
    # redireciona para index.php (front controller do Laravel).
    # Isso é essencial para que o roteamento do Laravel funcione.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------
    # Processamento PHP (FastCGI → PHP-FPM)
    # -----------------------------------------------------------
    # Quando a requisição é para um arquivo .php, o Nginx
    # encaminha para o PHP-FPM no container "app" na porta 9000.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # "app" é o nome do container PHP-FPM no docker-compose
        fastcgi_pass app:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout para operações longas
        fastcgi_read_timeout 300;
    }

    # -----------------------------------------------------------
    # Bloquear acesso a arquivos ocultos (.env, .git, etc.)
    # -----------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -----------------------------------------------------------
    # Cache de arquivos estáticos
    # -----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # Logs
    # -----------------------------------------------------------
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
